name: Build installers

# Everything here runs on GitHub-hosted runners. Nothing is built locally.
# Trigger: pushing a v* tag (same tag that drives publish.yml) or manual dispatch.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build + runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 desktop-file-utils file
          python -m pip install --upgrade pip pyinstaller
          pip install -e .

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm lurkiti.spec

      - name: Assemble AppDir
        run: |
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r dist/lurkiti "$APPDIR/usr/bin/lurkiti"
          cp packaging/linux/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/linux/lurkiti.desktop "$APPDIR/lurkiti.desktop"
          cp src/lurkiti/resources/icons/app-icon.png "$APPDIR/lurkiti.png"

      - name: Build AppImage
        run: |
          curl -L -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir "Lurkiti-${GITHUB_REF_NAME}-x86_64.AppImage"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: Lurkiti-*-x86_64.AppImage

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -e .

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm lurkiti.spec

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\windows\lurkiti.iss"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/installer/*.exe
